x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
  REDIS_URL: redis://redis:6379
  SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
  MOCK_SMS: ${MOCK_SMS:-false}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL}
  OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME}
  LLM_MODEL_FAST: ${LLM_MODEL_FAST}
  LLM_MODEL_CAPABLE: ${LLM_MODEL_CAPABLE}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  JWT_SECRET: ${JWT_SECRET}
  BASE_URL: ${BASE_URL}
  DASHBOARD_URL: ${DASHBOARD_URL}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-${BASE_URL:-http://localhost:8000}/oauth/callback/google}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
  SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-${BASE_URL:-http://localhost:8000}/oauth/callback/slack}
  MCP_OAUTH_REDIRECT_URI: ${MCP_OAUTH_REDIRECT_URI:-${BASE_URL:-http://localhost:8000}/connections/callback}
  MCP_ALLOWLIST: ${MCP_ALLOWLIST}
  BRAVE_API_KEY: ${BRAVE_API_KEY}
  CONNECTIONS_SERVICE_URL: ${CONNECTIONS_SERVICE_URL:-http://connections:8001}

services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-operator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operator} -d ${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python scripts/run_worker.py
    volumes:
      - sqlite_data:/app/data
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  connections:
    build:
      context: ./connections
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    command: python scripts/run_scheduler.py
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis_data:
  sqlite_data:
  postgres_data:
