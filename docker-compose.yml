services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-operator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operator} -d ${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    restart: "no"
    volumes:
      - ./alembic:/app/alembic
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - sqlite_data:/app/data
      # dashboard/dist is baked into the image — do NOT mount .:/app or it gets overridden
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
      - REDIS_URL=redis://redis:6379
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python scripts/run_worker.py
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
      - REDIS_URL=redis://redis:6379
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  connections:
    build:
      context: ./connections
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
      - DASHBOARD_URL=http://localhost:8000
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./connections:/app
    restart: unless-stopped

  scheduler:
    build: .
    command: python scripts/run_scheduler.py
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./config:/app/config
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-operator}:${POSTGRES_PASSWORD:-operator}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-assistant}
      - REDIS_URL=redis://redis:6379
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis_data:
  sqlite_data:
  postgres_data:
